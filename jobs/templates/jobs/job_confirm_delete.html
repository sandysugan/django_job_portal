{% extends 'base.html' %}
{% block title %}Delete Job - JobPortal{% endblock %}
{% block content %}

<div class="container-sm">
  <div class="form-card mt-3 text-center">
    <div style="font-size:4rem;">⚠️</div>
    <h2 class="mt-2">Delete this job?</h2>
    <p class="text-muted mt-1">
      You are about to delete <strong>"{{ job.title }}"</strong>.<br>
      This action cannot be undone.
    </p>
    <form method="POST" class="mt-3">
      {% csrf_token %}
      <div class="d-flex gap-2 justify-center">
        <button type="submit" class="btn btn-danger btn-lg">Yes, Delete</button>
        <a href="{% url 'recruiter_jobs' %}" class="btn btn-outline btn-lg">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
