{% extends 'base.html' %}
{% block title %}Update Status{% endblock %}
{% block content %}

<div class="container-sm">
  <div class="form-card mt-3">
    <div class="form-title">Update Application Status</div>
    <p class="form-subtitle">
      Applicant: <strong>{{ application.user.username }}</strong> →
      Job: <strong>{{ application.job.title }}</strong>
    </p>

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>Status</label>
        {{ form.status }}
      </div>
      <div class="d-flex gap-2 mt-2">
        <button type="submit" class="btn btn-primary btn-lg">Update Status</button>
        <a href="{% url 'job_applications' application.job.pk %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
